```html
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UZ AI — Sun’iy intellekt yordamchisi</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 280px;
      background: #171a21;
      border-right: 1px solid #292d36;
      display: flex;
      flex-direction: column;
      padding: 18px;
      transition: 0.25s;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .logo span {
      opacity: .65;
      font-size: 13px;
      display: block;
      margin-top: 3px;
      font-weight: normal;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #111;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .new-chat:hover {
      opacity: .9;
    }

    .search {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid #30343d;
      outline: none;
      background: #20242d;
      color: white;
      margin-bottom: 15px;
    }

    .search::placeholder {
      color: #8d929c;
    }

    .history-title {
      font-size: 12px;
      color: #858b96;
      margin: 5px 3px 9px;
    }

    .history {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 5px;
      cursor: pointer;
      color: #ddd;
    }

    .history-item:hover,
    .history-item.active {
      background: #252a34;
    }

    .history-name {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .delete-chat {
      border: 0;
      background: transparent;
      color: #777;
      font-size: 20px;
      padding: 0 3px;
    }

    .delete-chat:hover {
      color: #fff;
    }

    .sidebar-bottom {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .small-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #30343d;
      border-radius: 10px;
      background: #20242d;
      color: #fff;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #292d36;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      background: #11141a;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 24px;
    }

    .top-title {
      flex: 1;
      font-size: 18px;
      font-weight: 700;
    }

    .top-btn {
      border: 0;
      background: transparent;
      color: white;
      font-size: 20px;
      padding: 8px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 7%;
    }

    /* MESSAGE */

    .message {
      display: flex;
      gap: 13px;
      max-width: 900px;
      margin: 0 auto 24px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      background: #252a34;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 7px;
      opacity: .75;
    }

    .message-text {
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .message-text {
      background: #20242d;
      border-radius: 13px;
      padding: 12px 15px;
      display: inline-block;
      max-width: 100%;
    }

    /* CODE */

    .code-box {
      margin: 14px 0;
      border: 1px solid #30343d;
      border-radius: 12px;
      overflow: hidden;
      background: #0b0d11;
    }

    .code-head {
      padding: 9px 12px;
      background: #1c2028;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #aaa;
    }

    .code-copy {
      border: 0;
      border-radius: 7px;
      padding: 6px 9px;
      background: #303641;
      color: white;
      font-size: 12px;
    }

    .code-content {
      padding: 14px;
      overflow-x: auto;
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre;
    }

    /* TYPING */

    .typing {
      display: flex;
      gap: 5px;
      padding-top: 5px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .25;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* INPUT */

    .input-area {
      padding: 15px 7% 20px;
      border-top: 1px solid #292d36;
      background: #11141a;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #20242d;
      border: 1px solid #343944;
      border-radius: 15px;
      padding: 8px;
    }

    #input {
      flex: 1;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: white;
      padding: 9px;
      min-height: 42px;
    }

    #input::placeholder {
      color: #888e99;
    }

    #send {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #111;
      font-size: 18px;
      font-weight: bold;
    }

    #send:hover {
      opacity: .85;
    }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #777;
      margin-top: 8px;
    }

    /* LIGHT */

    body.light {
      background: #f5f6f8;
      color: #171717;
    }

    body.light .sidebar {
      background: #fff;
      border-color: #ddd;
    }

    body.light .topbar,
    body.light .input-area {
      background: #fff;
      border-color: #ddd;
    }

    body.light .search,
    body.light .small-btn,
    body.light .message.user .message-text,
    body.light .input-box {
      background: #f1f2f4;
      color: #171717;
      border-color: #ddd;
    }

    body.light #input {
      color: #171717;
    }

    body.light .history-item:hover,
    body.light .history-item.active {
      background: #eee;
    }

    body.light .top-btn,
    body.light .mobile-menu {
      color: #111;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        z-index: 20;
        left: -290px;
        top: 0;
        bottom: 0;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .chat {
        padding: 22px 15px;
      }

      .input-area {
        padding: 10px 12px 15px;
      }

      .message {
        gap: 9px;
      }

      .avatar {
        width: 34px;
        min-width: 34px;
        height: 34px;
      }

      .topbar {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="logo">
        🤖 UZ AI
        <span>Sun’iy intellekt yordamchisi</span>

    <main class="main">

      <div id="chat" class="chat"></div>

      <div class="input-area">

          ></textarea>

          <button
            id="send"

  </div>


  <!-- MUHIM: app.js public papkaning ichida -->
  <script src="app.js"></script>

</body>
</html>
